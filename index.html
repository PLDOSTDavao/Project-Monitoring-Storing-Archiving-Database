<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Monitoring, Storing & Archiving Database</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PLDOSTDavao/pmsad-assets/blob/d26851da58b8aa8b952220979a4679ad46ef5491/tatak-tab-icon-512.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PLDOSTDavao/pmsad-assets/blob/d26851da58b8aa8b952220979a4679ad46ef5491/tatak-tab-icon-512.png">
  <style>html, body { margin: 0; background: #0a1120; }</style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzjyh0ZioZDIVmGvwoE38gP8QpQGY2Q8bATyj-geD5MYkLntPwnCDHSPY7FqZvhovY/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
